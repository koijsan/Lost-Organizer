                try { localStorage.setItem('la_lang', code); } catch (e) { /* ignore */ }
            };
            useEffect(() => {
                document.documentElement.lang = { pt: 'pt-BR', en: 'en', es: 'es' }[lang] || 'pt-BR';
                const md = document.querySelector('meta[name="description"]');
                if (md) md.setAttribute('content', t('metaDesc'));
                const og = document.querySelector('meta[property="og:description"]');
                if (og) og.setAttribute('content', t('ogDesc'));
            }, [lang]);

            // 1. ROSTER GLOBAL (Personagens são compartilhados entre todas as Raids)
            const [characters, setCharacters] = useState(() => {
                const saved = localStorage.getItem('la_global_chars');
                if (saved) return JSON.parse(saved);
                
                const oldChars = localStorage.getItem('la_chars');
                if (oldChars) {
                    return JSON.parse(oldChars).map(c => {
                        const { location, ...rest } = c;
                        return rest;
                    });
                }
                return [];
            });
            
            const [rosterColors, setRosterColors] = useState(() => {
                const saved = localStorage.getItem('la_colors');
                return saved ? JSON.parse(saved) : {};
            });

            // 2. SISTEMA DE MÚLTIPLAS RAIDS
            const [raids, setRaids] = useState(() => {
                const saved = localStorage.getItem('la_raids');
                if (saved) {
                    return JSON.parse(saved).map(r => ({
                        ...r,
                        minIlevel: r.minIlevel || '',
                        maxIlevel: r.maxIlevel || '',
                        groups: r.groups.map(g => ({ ...g, completed: !!g.completed }))
                    }));
                }

                const oldChars = localStorage.getItem('la_chars');
                if (oldChars) {
                    const parsedChars = JSON.parse(oldChars);
                    const assignments = {};
                    parsedChars.forEach(c => { if (c.location && c.location !== 'garage') assignments[c.id] = c.location; });
                    
                    return [{
                        id: 'default_raid',
                        title: localStorage.getItem('la_title') || t('firstRaid'),
                        emoji: localStorage.getItem('la_emoji') || '🐉',
                        minIlevel: '',
                        maxIlevel: '',
                        groups: (JSON.parse(localStorage.getItem('la_groups')) || [{ id: 'party1', title: t('groupN', { n: 1 }) }, { id: 'party2', title: t('groupN', { n: 2 }) }]).map(g => ({...g, completed: false})),
                        assignments: assignments
                    }];
                }
                
                return [{
                    id: Date.now().toString(), title: t('newRaidDefault'), emoji: '⚔️', minIlevel: '', maxIlevel: '',
                    groups: [{ id: 'party1', title: t('groupN', { n: 1 }), completed: false }, { id: 'party2', title: t('groupN', { n: 2 }), completed: false }], assignments: {}
                }];
            });

            const [activeRaidId, setActiveRaidId] = useState(() => localStorage.getItem('la_active_raid') || raids[0]?.id);
            const activeRaid = raids.find(r => r.id === activeRaidId) || raids[0];

            // Estados UI Temporários
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingChar, setEditingChar] = useState(null);
            const [dragOverCharId, setDragOverCharId] = useState(null);
            
            // Novos Estados para os Modais Customizados
            const [alertDialog, setAlertDialog] = useState({ isOpen: false, message: '' });
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null });

            const showAlert = (message) => setAlertDialog({ isOpen: true, message });
            const showConfirm = (message, onConfirmCallback) => setConfirmDialog({ isOpen: true, message, onConfirm: onConfirmCallback });

            // --- AUTO-SAVE ---
            useEffect(() => { localStorage.setItem('la_global_chars', JSON.stringify(characters)); }, [characters]);
            useEffect(() => { localStorage.setItem('la_colors', JSON.stringify(rosterColors)); }, [rosterColors]);
            useEffect(() => { localStorage.setItem('la_raids', JSON.stringify(raids)); }, [raids]);
            useEffect(() => { localStorage.setItem('la_active_raid', activeRaidId); }, [activeRaidId]);

            // --- HELPERS ---
            const updateActiveRaid = (updater) => {
                setRaids(prev => prev.map(r => r.id === activeRaidId ? updater(r) : r));
            };

            const getCharLocation = (charId) => activeRaid.assignments[charId] || 'garage';

            // --- DESFAZER (histórico de alterações; atalho Ctrl+Z) ---
            const historyRef = useRef([]);
            const prevStateRef = useRef({ raids, characters });
            const lastChangeRef = useRef(0);
            const skipHistoryRef = useRef(false);
            const [historyCount, setHistoryCount] = useState(0);

            useEffect(() => {
                if (skipHistoryRef.current) {
                    skipHistoryRef.current = false;
                    prevStateRef.current = { raids, characters };
                    return;
                }
                const prev = prevStateRef.current;
                if (prev.raids === raids && prev.characters === characters) return;
                const now = Date.now();
                // Alterações em rajada (ex.: digitando um nome) viram um único passo do histórico
                if (now - lastChangeRef.current > 800) {
                    historyRef.current.push(prev);
                    if (historyRef.current.length > 50) historyRef.current.shift();
                    setHistoryCount(historyRef.current.length);
                }
                lastChangeRef.current = now;
                prevStateRef.current = { raids, characters };
            }, [raids, characters]);

            const undo = () => {
                const snap = historyRef.current.pop();
                setHistoryCount(historyRef.current.length);
                if (!snap) return;
                const cur = prevStateRef.current;
                if (snap.raids === cur.raids && snap.characters === cur.characters) return;
                skipHistoryRef.current = true;
                setRaids(snap.raids);
                setCharacters(snap.characters);
            };

            useEffect(() => {
                const onKey = (e) => {
                    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !['input', 'textarea', 'select'].includes(tag)) {
                        e.preventDefault();
                        undo();
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            // --- BUSCA / FILTROS DA GARAGEM ---
            const [search, setSearch] = useState('');
            const [roleFilter, setRoleFilter] = useState('Todos');
            const [classFilter, setClassFilter] = useState('Todas');
            const hasGarageFilter = !!search.trim() || roleFilter !== 'Todos' || classFilter !== 'Todas';
            const [panelOpen, setPanelOpen] = useState(() => window.innerWidth >= 1024); // só afeta telas pequenas
            const [menuOpen, setMenuOpen] = useState(false);
            const menuRef = useRef(null);
            const importInputRef = useRef(null);
            useEffect(() => {
                if (!menuOpen) return;
                const close = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
                const esc = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
                document.addEventListener('mousedown', close);
                document.addEventListener('touchstart', close);
                document.addEventListener('keydown', esc);
                return () => {
                    document.removeEventListener('mousedown', close);
                    document.removeEventListener('touchstart', close);
                    document.removeEventListener('keydown', esc);
                };
            }, [menuOpen]);

            // --- RESET SEMANAL (quarta 04:00 Brasília): contagem regressiva + aviso ---
            const [nowTick, setNowTick] = useState(Date.now());
            useEffect(() => {
                const id = setInterval(() => setNowTick(Date.now()), 30000);
                return () => clearInterval(id);
            }, []);
            const [resetAck, setResetAck] = useState(() => {
                try { return Number(localStorage.getItem('la_reset_ack')) || lastResetTime(); } catch { return lastResetTime(); }
            });
            useEffect(() => { try { localStorage.setItem('la_reset_ack', String(resetAck)); } catch (e) { /* ignore */ } }, [resetAck]);
            const currentReset = lastResetTime(nowTick);
            const nextResetIn = currentReset + WEEK_MS - nowTick;
            const hasCompleted = raids.some(r => r.groups.some(g => g.completed));
            const resetPending = currentReset > resetAck && hasCompleted;
            useEffect(() => {
                // Passou um reset e não há nada concluído: só atualiza o marcador, sem incomodar
                if (currentReset > resetAck && !hasCompleted) setResetAck(currentReset);
            }, [currentReset, hasCompleted, resetAck]);

            const applyWeeklyReset = () => {
                setRaids(prev => prev.map(r => ({
                    ...r,
                    groups: r.groups.map(g => ({ ...g, completed: false }))
                })));
                setResetAck(lastResetTime());
            };

            // --- COMPARTILHAR POR LINK ---
            const shareLink = async () => {
                const assigned = new Set(Object.keys(activeRaid.assignments));
                const chars = characters.filter(c => assigned.has(c.id));
                if (chars.length === 0) return showAlert(t('shareNeedChars'));
                const colors = {};
                chars.forEach(c => { if (rosterColors[c.roster]) colors[c.roster] = rosterColors[c.roster]; });
                try {
                    const code = await encodeShare(packShare(activeRaid, chars, colors));
                    const url = `${location.href.split('#')[0]}#s=${code}`;
                    const longWarn = url.length > 1900 ? t('shareLongWarn') : '';
                    try {
                        await navigator.clipboard.writeText(url);
                        showAlert(t('shareCopied', { title: activeRaid.title, n: chars.length }) + longWarn);
                    } catch {
                        window.prompt(t('sharePrompt'), url);
                    }
                } catch {
                    showAlert(t('shareFail'));
                }
            };

            const importShared = (d) => {
                const stamp = Date.now();
                const idMap = {};
                const newChars = d.characters.slice(0, 200).map((c, i) => {
                    const id = `sh${stamp}_${i}`;
                    idMap[c.id] = id;
                    return {
                        id,
                        roster: String(c.roster || '').slice(0, 40),
                        charClass: LA_CLASSES.includes(c.charClass) ? c.charClass : LA_CLASSES[0],
                        ilvl: String(Number(c.ilvl) || ''),
                        primaryRole: c.primaryRole === 'Suporte' ? 'Suporte' : 'DPS',
                        secondaryRole: String(c.secondaryRole || 'Nenhuma').slice(0, 40)
                    };
                });
                const r = d.raid;
                const groups = r.groups.slice(0, 30).map(g => ({ id: String(g.id), title: String(g.title || t('groupN', { n: r.groups.indexOf(g) + 1 })).slice(0, 28), completed: false }));
                const groupIds = new Set(groups.map(g => g.id));
                const assignments = {};
                Object.entries(r.assignments || {}).forEach(([cid, loc]) => {
                    if (idMap[cid] && groupIds.has(loc)) assignments[idMap[cid]] = loc;
                });
                const colors = {};
                Object.entries(d.colors || {}).forEach(([k, v]) => { if (/^#[0-9a-f]{3,8}$/i.test(String(v))) colors[String(k).slice(0, 40)] = v; });
                const newRaid = {
                    id: `sh${stamp}`,
                    title: `${String(r.title || 'Raid').slice(0, 40)} ${t('sharedSuffix')}`,
                    emoji: String(r.emoji || '⚔️').slice(0, 8),
                    minIlevel: '', maxIlevel: '',
                    mode: r.mode === 4 ? 4 : 8,
                    groups, assignments
                };
                setCharacters(prev => [...prev, ...newChars]);
                setRosterColors(prev => ({ ...colors, ...prev }));
                setRaids(prev => [...prev, newRaid]);
                setActiveRaidId(newRaid.id);
            };

            useEffect(() => {
                const m = location.hash.match(/^#s=(.+)$/);
                if (!m) return;
                (async () => {
                    try {
                        let d = await decodeShare(m[1]);
                        if (Array.isArray(d)) d = unpackShare(d);
                        if (!d || d.app !== 'lostark-raid-organizer' || !d.raid || !Array.isArray(d.raid.groups) || !Array.isArray(d.characters)) throw new Error('invalid');
                        history.replaceState(null, '', location.href.split('#')[0]);
                        showConfirm(t('importSharedConfirm', { title: String(d.raid.title || 'Raid').slice(0, 40), n: d.characters.length }), () => importShared(d));
                    } catch {
                        showAlert(t('shareInvalid'));
                    }
                })();
            }, []);

            // --- LÓGICA DE ABAS (TABS) ---
            const createNewRaid = () => {
                const newRaid = {
                    id: Date.now().toString(),
                    title: t('newRaidN', { n: raids.length + 1 }),
                    emoji: '📝',
                    minIlevel: '',
                    maxIlevel: '',
                    groups: [{ id: 'party1', title: t('groupN', { n: 1 }), completed: false }, { id: 'party2', title: t('groupN', { n: 2 }), completed: false }],
                    assignments: {}
                };
                setRaids([...raids, newRaid]);
                setActiveRaidId(newRaid.id);
            };

            const deleteCurrentRaid = () => {
                if (raids.length === 1) return showAlert(t('needOneRaid'));
                showConfirm(t('deleteRaidConfirm', { title: activeRaid.title }), () => {
                    const newRaids = raids.filter(r => r.id !== activeRaidId);
                    setRaids(newRaids);
                    setActiveRaidId(newRaids[0].id);
                });
            };

            // --- RESET SEMANAL ---
            const resetAllWeekly = () => {
                showConfirm(t('resetConfirm'), applyWeeklyReset);
            };

            // --- BACKUP: EXPORTAR / IMPORTAR ---
            const exportData = () => {
                const data = { app: 'lostark-raid-organizer', version: 1, characters, rosterColors, raids, activeRaidId };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lostark-organizer-${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const importData = (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const d = JSON.parse(reader.result);
                        if (!Array.isArray(d.characters) || !Array.isArray(d.raids) || d.raids.length === 0) throw new Error('invalid');
                        showConfirm(t('importConfirm'), () => {
                            setCharacters(d.characters);
                            setRosterColors(d.rosterColors || {});
                            setRaids(d.raids.map(r => ({
                                minIlevel: '', maxIlevel: '', assignments: {}, ...r,
                                groups: (r.groups || []).map(g => ({ ...g, completed: !!g.completed }))
                            })));
                            setActiveRaidId(d.raids[0].id);
                        });
                    } catch {
                        showAlert(t('importInvalid'));
                    }
                };
                reader.readAsText(file);
            };

            // --- CONCLUIR GRUPO ---
            const toggleGroupCompletion = (groupId) => {
                updateActiveRaid(raid => ({
                    ...raid,
                    groups: raid.groups.map(g => g.id === groupId ? { ...g, completed: !g.completed } : g)
                }));
            };

            // --- LÓGICA DRAG & DROP ---
            const handleDragStart = (e, charId) => e.dataTransfer.setData('charId', charId);
            const handleDragOver = (e) => e.preventDefault();

            const handleDrop = (e, newLocation, targetCharId = null) => {
                e.preventDefault(); e.stopPropagation(); setDragOverCharId(null);
                
                const charId = e.dataTransfer.getData('charId');
                if (!charId || charId === targetCharId) return;

                let capacityFull = false;

                updateActiveRaid(raid => {
                    // Bloquear drop se o grupo estiver concluído
                    const targetGroup = raid.groups.find(g => g.id === newLocation);
                    if (targetGroup && targetGroup.completed) {
                        showAlert(t('groupCompleted'));
                        capacityFull = true;
                        return raid;
                    }

                    const currentLoc = raid.assignments[charId] || 'garage';
                    const partyCount = Object.keys(raid.assignments).filter(k => raid.assignments[k] === newLocation).length;
                    
                    if (currentLoc !== newLocation && newLocation !== 'garage' && partyCount >= 4) {
                        showAlert(t('groupFull'));
                        capacityFull = true;
                        return raid;
                    }
                    
                    const newAssignments = { ...raid.assignments };
                    if (newLocation === 'garage') delete newAssignments[charId];
                    else newAssignments[charId] = newLocation;
                    
                    return { ...raid, assignments: newAssignments };
                });

                if (capacityFull) return;

                setCharacters(prev => {
                    const draggedIndex = prev.findIndex(c => c.id === charId);
                    if (draggedIndex === -1) return prev;
                    
                    const newArray = [...prev];
                    const [draggedChar] = newArray.splice(draggedIndex, 1);
                    
                    if (targetCharId) {
                        const targetIndex = newArray.findIndex(c => c.id === targetCharId);
                        newArray.splice(targetIndex, 0, draggedChar);
                    } else {
                        newArray.push(draggedChar);
                    }
                    return newArray;
                });
            };

            // --- LÓGICA GRUPOS DA RAID ATUAL ---
            const addGroup = () => {
                updateActiveRaid(raid => ({
                    ...raid,
                    groups: [...raid.groups, { id: `party${Date.now()}`, title: t('groupN', { n: raid.groups.length + 1 }), completed: false }]
                }));
            };

            const renameGroup = (groupId, newTitle) => {
                const clean = (newTitle || '').trim().slice(0, 28);
                updateActiveRaid(raid => ({
                    ...raid,
                    groups: raid.groups.map(g => {
                        if (g.id !== groupId) return g;
                        const fallback = t('groupN', { n: raid.groups.findIndex(x => x.id === groupId) + 1 });
                        return { ...g, title: clean || fallback };
                    })
                }));
            };

            const removeGroup = (groupId) => {
                updateActiveRaid(raid => {
                    const newAssignments = { ...raid.assignments };
                    Object.keys(newAssignments).forEach(charId => {
                        if (newAssignments[charId] === groupId) delete newAssignments[charId];
                    });
                    return { ...raid, groups: raid.groups.filter(g => g.id !== groupId), assignments: newAssignments };
                });
            };

            const setRaidLayout = (size) => {
                updateActiveRaid(raid => {
                    let groups = [...raid.groups];
                    if (groups.length === 0) groups.push({ id: 'party1', title: t('groupN', { n: 1 }), completed: false });
                    // Modo 8: garante número par de grupos para fechar o(s) lobby(s)
                    if (size === 8 && groups.length % 2 !== 0) {
                        groups.push({ id: `party${Date.now()}`, title: t('groupN', { n: groups.length + 1 }), completed: false });
                    }
                    return { ...raid, mode: size, groups };
                });
            };

            // --- LÓGICA MODAL (GLOBAL) ---
            const openEditModal = (char = null) => {
                if (char) {
                    setEditingChar({ ...char, tempColor: rosterColors[char.roster] || '#333333' });
                } else {
                    setEditingChar({ 
                        id: Date.now().toString(), roster: '', charClass: LA_CLASSES[0], 
                        ilvl: '1600', primaryRole: 'DPS', secondaryRole: 'Nenhuma', tempColor: '#4F46E5' 
                    });
                }
                setIsModalOpen(true);
            };

            const saveCharacter = () => {
                if (!editingChar.roster.trim()) return showAlert(t('rosterRequired'));
                setRosterColors(prev => ({ ...prev, [editingChar.roster]: editingChar.tempColor }));
                const { tempColor, ...charDataToSave } = editingChar;

                setCharacters(prev => {
                    const exists = prev.find(c => c.id === charDataToSave.id);
                    return exists ? prev.map(c => c.id === charDataToSave.id ? charDataToSave : c) : [...prev, charDataToSave];
                });
                setIsModalOpen(false);
            };

            const deleteCharacter = (id) => {
                showConfirm(t('deleteCharConfirm'), () => {
                    setCharacters(prev => prev.filter(c => c.id !== id));
                    setRaids(prev => prev.map(r => {
                        const newAssignments = { ...r.assignments };
                        delete newAssignments[id];
                        return { ...r, assignments: newAssignments };
                    }));
                    setIsModalOpen(false);
                });
            };

            // --- RENDERIZADORES VISUAIS ---
            const renderRoleIcon = (role, key) => {
                if (!role || role === 'Nenhuma') return null;
                switch (role) {
                    case 'DPS': return <Icons.Sword key={key} className="text-gray-200" title={roleLabel('DPS')} />;
                    case 'Suporte': return <Icons.Plus key={key} className="text-green-400" title={roleLabel('Suporte')} />;
                    case 'Crítico': return <Icons.Zap key={key} className="text-yellow-400" title={roleLabel('Crítico')} />;
                    case 'Dano Crítico': return <Icons.Flame key={key} className="text-red-500" title={roleLabel('Dano Crítico')} />;
                    case 'Armadura': return <Icons.ShieldAlert key={key} className="text-orange-400" title={roleLabel('Armadura')} />;
                    case 'Posicional': return <Icons.Crosshair key={key} className="text-purple-400" title={roleLabel('Posicional')} />;
                    case 'Dano': return <Icons.Sword key={key} className="text-red-400" title={roleLabel('Dano')} />;
                    case 'Defesa': return <Icons.Shield key={key} className="text-blue-400" title={roleLabel('Defesa')} />;
                    default: return null;
                }
            };

            // Card Adaptável (Suporta Modo Card Original e Novo Modo Compacto de Barra)
            const CharacterCard = ({ char, isDisabled, compact = false }) => {
                const bgColor = rosterColors[char.roster] || '#333333';
                const isDragOver = dragOverCharId === char.id;
                const currentLocation = getCharLocation(char.id);
                
                // Modo Barra Compacto - Estilo MMO Party Frames (Ideal para lobbies de 8)
                if (compact) {
                    return (
                        <div draggable={!isDisabled} onDragStart={(e) => !isDisabled && handleDragStart(e, char.id)}
                             onDragOver={(e) => { if(!isDisabled) { e.preventDefault(); e.stopPropagation(); setDragOverCharId(char.id); } }}
                             onDragLeave={(e) => { e.preventDefault(); if (dragOverCharId === char.id) setDragOverCharId(null); }}
                             onDrop={(e) => !isDisabled && handleDrop(e, currentLocation, char.id)}
                             className={`group relative flex items-center justify-between p-2 rounded-lg border shadow-sm transition-all text-xs h-12
                             ${isDisabled ? 'cursor-not-allowed opacity-70' : 'cursor-grab active:cursor-grabbing hover:brightness-115'} 
                             ${isDragOver && !isDisabled ? 'border-indigo-400 ring-2 ring-indigo-400/50 transform scale-[1.01]' : 'border-slate-700/40'}`}
                             style={{ 
                                 backgroundColor: bgColor,
                                 backgroundImage: 'linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0.45))'
                             }}>
                            
                            {!isDisabled && (
                                <button onClick={() => openEditModal(char)} className="absolute inset-0 bg-slate-900/90 rounded-lg opacity-0 group-hover:opacity-100 flex items-center justify-center gap-1.5 transition-opacity z-10 text-white font-extrabold border border-slate-650" title={t('editChar')}>
                                    <Icons.Edit2 size={14} /> <span className="text-[10px] tracking-wide uppercase">{t('editShort')}</span>
                                </button>
                            )}

                            {/* Informações da Esquerda: Classe e Nick/Roster */}
                            <div className="flex items-center gap-2 min-w-0 flex-1 z-0">
                                <span className="text-lg flex-shrink-0" title={char.charClass}>{CLASS_ICONS[char.charClass] || '❓'}</span>
                                <div className="flex flex-col min-w-0">
                                    <span className="font-extrabold text-white text-[11px] leading-tight truncate [text-shadow:_0_1px_2px_black]">{char.charClass}</span>
                                    <span className="text-[8px] font-bold text-amber-300 truncate tracking-wider bg-slate-950/85 px-1 py-0.5 rounded border border-slate-800/40 uppercase w-max [text-shadow:_0_1px_1px_black] leading-none mt-0.5" title={t('rosterOwnerTip')}>{char.roster}</span>
                                </div>
                            </div>

                            {/* Item Level centralizado */}
                            <div className="mx-2 flex-shrink-0 z-0">
                                <span className="text-[10px] font-extrabold text-white bg-black/45 px-1.5 py-0.5 rounded border border-black/20 shadow-sm [text-shadow:_0_1px_1px_black]">
                                    {char.ilvl}
                                </span>
                            </div>

                            {/* Ícones de Sinergia à Direita */}
                            <div className="flex gap-1 bg-black/35 p-1 rounded-md border border-black/20 flex-shrink-0 items-center z-0">
                                {renderRoleIcon(char.primaryRole, 'p')}
                                {char.secondaryRole !== 'Nenhuma' && renderRoleIcon(char.secondaryRole, 's')}
                            </div>

                            {!isDisabled && (
                                <div className="absolute left-0.5 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-20 pointer-events-none transition-opacity">
                                    <Icons.GripHorizontal size={14} />
                                </div>
                            )}
                        </div>
                    );
                }

                // Modo Card Clássico (Usado na Garagem / Disponíveis)
                return (
                    <div draggable={!isDisabled} onDragStart={(e) => !isDisabled && handleDragStart(e, char.id)}
                         onDragOver={(e) => { if(!isDisabled) { e.preventDefault(); e.stopPropagation(); setDragOverCharId(char.id); } }}
                         onDragLeave={(e) => { e.preventDefault(); if (dragOverCharId === char.id) setDragOverCharId(null); }}
                         onDrop={(e) => !isDisabled && handleDrop(e, currentLocation, char.id)}
                         className={`group relative flex flex-col p-3 rounded-xl shadow-md transition-all border min-h-[96px] 
                         ${isDisabled ? 'cursor-not-allowed' : 'cursor-grab active:cursor-grabbing hover:brightness-110'} 
                         ${isDragOver && !isDisabled ? 'border-indigo-400 ring-2 ring-indigo-400 transform scale-[1.02]' : 'border-slate-700/50'}`}
                         style={{ backgroundColor: bgColor }}>
                        
                        <div className="absolute top-2 right-2 flex gap-1.5 bg-black/40 px-2 py-1.5 rounded-lg items-center z-0 shadow-sm border border-black/20">
                            {renderRoleIcon(char.primaryRole, 'p')}
                            {char.secondaryRole !== 'Nenhuma' && renderRoleIcon(char.secondaryRole, 's')}
                        </div>

                        {!isDisabled && (
                            <button onClick={() => openEditModal(char)} className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1.5 bg-slate-900 rounded-lg hover:bg-black transition-opacity z-10 text-white shadow-lg border border-slate-600 flex items-center justify-center" title={t('editChar')}>
                                <Icons.Edit2 size={16} />
                            </button>
                        )}

                        <div className="mb-2 w-max">
                            <span className="text-[11px] font-extrabold px-2 py-1 bg-slate-950/70 text-amber-200 border-slate-800 rounded uppercase tracking-wider text-white shadow-sm border border-black/20 [text-shadow:_0_1px_2px_black]">{char.roster}</span>
                        </div>

                        <div className="flex justify-between items-end mt-auto pt-2 gap-2">
                            <span className="font-extrabold text-white text-[15px] truncate [text-shadow:_0_1px_3px_black] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
                                {CLASS_ICONS[char.charClass]} {char.charClass}
                            </span>
                            <span className="text-xs font-bold text-white bg-black/40 px-2 py-1 rounded-md flex-shrink-0 border border-black/20 shadow-sm [text-shadow:_0_1px_2px_black]">ilvl {char.ilvl}</span>
                        </div>

                        {!isDisabled && (
                            <div className="absolute top-1/2 -left-2 transform -translate-y-1/2 opacity-0 group-hover:opacity-30 transition-opacity">
                                <Icons.GripHorizontal size={24} />
                            </div>
                        )}
                    </div>
                );
            };

            // Zona de Soltar Adaptável (Suporta Layout Normal e Layout Horizontal do Topo)
            const DropZone = ({ locationId, title, isParty, compact = false, onAddClick = null, sidebar = false }) => {
                let charsInZone = characters.filter(c => getCharLocation(c.id) === locationId);
                const groupObj = isParty ? activeRaid.groups.find(g => g.id === locationId) : null;
                const isCompleted = groupObj?.completed;
                
                // Aplica o filtro de iLvl apenas na Garagem
                if (!isParty) {
                    if (activeRaid.minIlevel) {
                        charsInZone = charsInZone.filter(c => Number(c.ilvl || 0) >= Number(activeRaid.minIlevel));
                    }
                    if (activeRaid.maxIlevel) {
                        charsInZone = charsInZone.filter(c => Number(c.ilvl || 0) <= Number(activeRaid.maxIlevel));
                    }
                    const q = normText(search.trim());
                    if (q) charsInZone = charsInZone.filter(c => normText(`${c.roster} ${c.charClass}`).includes(q));
                    if (roleFilter !== 'Todos') charsInZone = charsInZone.filter(c => c.primaryRole === roleFilter);
                    if (classFilter !== 'Todas') charsInZone = charsInZone.filter(c => c.charClass === classFilter);
                }

                const supports = charsInZone.filter(c => c.primaryRole === 'Suporte').length;
                const dps = charsInZone.filter(c => c.primaryRole === 'DPS').length;
                const isMeta = supports === 1 && dps === 3;

                // Checa classes duplicadas na mesma PT
                const duplicateMap = {};
                charsInZone.forEach(c => { duplicateMap[c.charClass] = (duplicateMap[c.charClass] || 0) + 1; });
                const hasDuplicates = Object.values(duplicateMap).some(count => count > 1);

                return (
                    <div className={`relative flex flex-col bg-slate-800 rounded-xl border-2 p-4 flex-shrink-0 transition-all duration-300
                         ${isParty 
                            ? (compact ? 'min-h-[290px] w-full border-slate-700/30 bg-slate-900/30' : 'min-h-[400px] w-80 border-slate-700/50') 
                            : 'w-full min-h-[160px] border-slate-700/50 shadow-2xl bg-slate-800/40'
                         }
                         ${isCompleted ? 'opacity-50 grayscale-[0.5] border-green-950 bg-slate-850/50' : ''}`}
                         onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, locationId)}>
                        
                        <div className={`flex ${sidebar ? 'flex-col gap-3' : 'justify-between items-start'} mb-4 border-b pb-2 ${isCompleted ? 'border-green-900/40' : 'border-slate-700/60'}`}>
                            <div className="flex flex-col">
                                <h2 className={`text-sm font-extrabold flex flex-wrap items-center gap-2 ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-200'}`}>
                                    {isParty ? (
                                        <Icons.Users size={16} className={isCompleted ? "text-slate-500" : "text-indigo-400"}/>
                                    ) : (
                                        <Icons.Users size={16} className="text-amber-400"/>
                                    )} 
                                    {isParty ? (
                                        <input
                                            key={title}
                                            type="text"
                                            defaultValue={title}
                                            maxLength={28}
                                            title={t('renameTip')}
                                            onBlur={(e) => { if (e.target.value !== title) renameGroup(locationId, e.target.value); }}
                                            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                                            className={`bg-transparent min-w-0 w-36 font-extrabold text-sm border-b border-dashed border-slate-600/60 hover:border-slate-400 focus:border-indigo-400 focus:outline-none transition-colors ${isCompleted ? 'line-through' : ''}`}
                                        />
                                    ) : title}
                                    {!isParty && (
                                        <span className="text-[11px] font-bold text-slate-400 bg-slate-900/65 px-2 py-0.5 rounded-full border border-slate-700/65 ml-2 shadow-inner">
                                            {t('availableCount', { n: charsInZone.length })}
                                        </span>
                                    )}
                                </h2>
                                {isParty && charsInZone.length > 0 && (
                                    <div className="flex flex-wrap gap-1 mt-0.5 text-[9px] font-extrabold">
                                        {isMeta ? (
                                            <span className="text-green-400 uppercase tracking-wide">{t('metaPT')}</span>
                                        ) : (
                                            <span className="text-slate-400 tracking-wide uppercase">{supports} {t('supShort')} / {dps} DPS</span>
                                        )}
                                        {hasDuplicates && (
                                            <span className="text-amber-400 uppercase tracking-wide" title={t('dupSynergyTip')}>{t('dupSynergy')}</span>
                                        )}
                                    </div>
                                )}
                            </div>
                            <div className={`flex items-center gap-1.5 ${sidebar ? 'w-full' : ''}`}>
                                {isParty ? (
                                    <>
                                        <button 
                                            onClick={() => toggleGroupCompletion(locationId)} 
                                            className={`p-1 rounded transition-all ${isCompleted ? 'bg-green-900 text-green-300 hover:bg-green-800' : 'bg-slate-700 text-slate-400 hover:text-green-400'}`}
                                            title={isCompleted ? t('unmarkTip') : t('markTip')}
                                        >
                                            <Icons.CheckCircle size={14} />
                                        </button>
                                        <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${charsInZone.length === 4 ? 'bg-indigo-900/50 text-indigo-300' : 'bg-slate-700 text-slate-300'}`}>{charsInZone.length}/4</span>
                                        <button onClick={() => removeGroup(locationId)} className="text-slate-500 hover:text-red-400" title={t('removeGroupTip')}><Icons.X size={14} /></button>
                                    </>
                                ) : onAddClick ? (
                                    <button 
                                        onClick={onAddClick} 
                                        className={`px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 hover:border-indigo-400 text-white text-xs font-extrabold rounded-lg transition-all flex items-center gap-1.5 shadow-md border border-indigo-600 active:scale-95 ${sidebar ? 'w-full justify-center' : ''}`} 
                                        title={t('createCharTip')}
                                    >
                                        <Icons.Plus size={12} strokeWidth="3" />
                                        <span>{t('createChar')}</span>
                                    </button>
                                ) : null}
                            </div>
                        </div>

                        {(!isParty && (activeRaid.minIlevel || activeRaid.maxIlevel)) && (
                            <div className="text-xs text-indigo-300 mb-4 font-bold flex items-center gap-1.5 bg-indigo-900/40 p-2 rounded-lg border border-indigo-500/30 w-max shadow-sm">
                                <Icons.Filter size={14} /> {t('filtering')} {activeRaid.minIlevel || '0'} {activeRaid.maxIlevel ? t('upTo', { n: activeRaid.maxIlevel }) : '+'}
                            </div>
                        )}

                        {/* Layout de Exibição Condicional (Coluna se for Party, Grade Horizontal Ampla se for Garagem) */}
                        <div className={isParty 
                            ? "flex-1 flex flex-col gap-2" 
                            : (sidebar ? "flex flex-col gap-2" : "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 max-h-[300px] overflow-y-auto pr-1 scrollbar-thin")
                        }>
                            {charsInZone.length === 0 ? (
                                <div className={`flex items-center justify-center text-slate-500 border-2 border-dashed border-slate-700/60 rounded-lg p-6 text-center text-xs ${isParty ? 'flex-1 min-h-[120px]' : 'col-span-full py-12 bg-slate-900/10'}`}>
                                    {(!isParty && (activeRaid.minIlevel || activeRaid.maxIlevel || hasGarageFilter)) ? t('emptyFiltered') : t('emptyGarage')}
                                </div>
                            ) : charsInZone.map(char => <CharacterCard key={char.id} char={char} isDisabled={isCompleted} compact={compact || sidebar} />)}
                        </div>
                    </div>
                );
            };

            // Nova função de renderização inteligente de Grupos (Envelopamento para Lobbies de 8 Players)
            const renderRaidLayout = () => {
                const pairedLayouts = [];
                const groups = activeRaid.groups;
                
                // Agrupa as PTs de duas em duas
                const solo = activeRaid.mode === 4;
                for (let i = 0; i < groups.length; i += solo ? 1 : 2) {
                    if (!solo && i + 1 < groups.length) {
                        pairedLayouts.push({
                            type: 'raid8',
                            g1: groups[i],
                            g2: groups[i+1]
                        });
                    } else {
                        pairedLayouts.push({
                            type: 'party4',
                            g1: groups[i]
                        });
                    }
                }

                return pairedLayouts.map((pair, index) => {
                    if (pair.type === 'raid8') {
                        const g1 = pair.g1;
                        const g2 = pair.g2;
                        
                        const charsG1 = characters.filter(c => getCharLocation(c.id) === g1.id);
                        const charsG2 = characters.filter(c => getCharLocation(c.id) === g2.id);
                        
                        const g1Sups = charsG1.filter(c => c.primaryRole === 'Suporte').length;
                        const g1Dps = charsG1.filter(c => c.primaryRole === 'DPS').length;
                        const g2Sups = charsG2.filter(c => c.primaryRole === 'Suporte').length;
                        const g2Dps = charsG2.filter(c => c.primaryRole === 'DPS').length;
                        
                        const totalSups = g1Sups + g2Sups;
                        const totalDps = g1Dps + g2Dps;
                        
                        // Coleta sinergias únicas combinadas
                        const synergiesSet = new Set();
                        [...charsG1, ...charsG2].forEach(c => {
                            if (c.secondaryRole && c.secondaryRole !== 'Nenhuma') {
                                synergiesSet.add(c.secondaryRole);
                            }
                        });
                        const uniqueSynergies = Array.from(synergiesSet);

                        // Calcula média de iLvl combinada
                        const allLobbyChars = [...charsG1, ...charsG2];
                        const avgIlvl = allLobbyChars.length > 0
                            ? (allLobbyChars.reduce((sum, c) => sum + Number(c.ilvl || 0), 0) / allLobbyChars.length).toFixed(1)
                            : null;

                        // Verifica classes duplicadas em uma mesma PT
                        const checkDuplicatesInParty = (charsList) => {
                            const map = {};
                            charsList.forEach(c => { map[c.charClass] = (map[c.charClass] || 0) + 1; });
                            return Object.values(map).some(count => count > 1);
                        };
                        const hasLobbyDuplicates = checkDuplicatesInParty(charsG1) || checkDuplicatesInParty(charsG2);

                        return (
                            <div key={`lobby-8-${index}`} className="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 shadow-2xl flex flex-col gap-4 w-full max-w-[680px] hover:border-indigo-500/35 transition-all duration-300">
                                
                                {/* Header do Lobby de Raid de 8 Players */}
                                <div className="flex flex-wrap justify-between items-center border-b border-slate-700/80 pb-3 gap-2">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 border border-indigo-500/20">
                                            <Icons.Users size={22} />
                                        </div>
                                        <div>
                                            <h3 className="text-base font-black text-white tracking-wide">{t('lobbyTitle')}</h3>
                                            <p className="text-[10px] text-indigo-300 font-extrabold tracking-wider uppercase">{g1.title} + {g2.title}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2 flex-wrap">
                                        {avgIlvl && (
                                            <span className="bg-slate-900/60 text-indigo-200 text-xs font-bold px-2 py-0.5 rounded border border-slate-700">
                                                {t('avgIlvl')}: {avgIlvl}
                                            </span>
                                        )}
                                        <div className="flex gap-1 text-[10px]">
                                            <span className={`px-2 py-0.5 rounded font-extrabold border ${totalSups === 2 ? 'bg-green-950/40 text-green-400 border-green-800/30' : 'bg-slate-900/60 text-slate-400 border-slate-700'}`}>
                                                {t('supsLabel')}: {totalSups}/2
                                            </span>
                                            <span className={`px-2 py-0.5 rounded font-extrabold border ${totalDps === 6 ? 'bg-indigo-950/40 text-indigo-300 border-indigo-800/30' : 'bg-slate-900/60 text-slate-400 border-slate-700'}`}>
                                                DPS: {totalDps}/6
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Sub-PTs em Duas Colunas Compactas */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <DropZone locationId={g1.id} title={g1.title} isParty={true} compact={true} />
                                    <DropZone locationId={g2.id} title={g2.title} isParty={true} compact={true} />
                                </div>

                                {/* Painel de Sinergias Combinadas */}
                                <div className="bg-slate-900/45 p-3 rounded-xl border border-slate-700/50 text-xs text-slate-400 flex flex-col gap-1.5">
                                    <div className="flex justify-between items-center flex-wrap gap-1">
                                        <span className="font-extrabold text-indigo-400 uppercase tracking-wider text-[10px]">{t('lobbySynergies')}</span>
                                        {hasLobbyDuplicates && (
                                            <span className="text-[10px] text-amber-400 font-bold flex items-center gap-1">
                                                {t('dupClassWarn')}
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5 mt-0.5">
                                        {uniqueSynergies.map(syn => (
                                            <span key={syn} className="bg-slate-850 text-indigo-200 px-2 py-1 rounded-lg border border-slate-700/50 flex items-center gap-1.5 font-semibold shadow-sm">
                                                {renderRoleIcon(syn, syn)} {roleLabel(syn)}
                                            </span>
                                        ))}
                                        {uniqueSynergies.length === 0 && (
                                            <span className="text-slate-500 italic">{t('noSynergy')}</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    } else {
                        // Grupo Isolado (PT Solta de 4 Players)
                        const g1 = pair.g1;
                        const ptChars = characters.filter(c => getCharLocation(c.id) === g1.id);
                        const ptSynergies = Array.from(new Set(ptChars.map(c => c.secondaryRole).filter(sr => sr && sr !== 'Nenhuma')));
                        const ptAvg = ptChars.length > 0 ? (ptChars.reduce((sum, c) => sum + Number(c.ilvl || 0), 0) / ptChars.length).toFixed(1) : null;
                        return (
                            <div key={`single-${g1.id}`} className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 shadow-xl flex flex-col gap-3 w-full max-w-[380px] hover:border-indigo-500/35 transition-all duration-300">
                                <div className="flex items-center justify-between border-b border-slate-700/70 pb-2">
                                    <span className="text-[10px] font-black tracking-widest uppercase text-indigo-300">{t('ptFrame', { n: index + 1 })}</span>
                                    {ptAvg && <span className="bg-slate-900/60 text-indigo-200 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">{t('avgIlvl')}: {ptAvg}</span>}
                                </div>
                                <DropZone locationId={g1.id} title={g1.title} isParty={true} compact={true} />
                                <div className="bg-slate-900/45 p-2.5 rounded-xl border border-slate-700/50 text-xs text-slate-400 flex flex-wrap gap-1.5 items-center">
                                    <span className="font-extrabold text-indigo-400 uppercase tracking-wider text-[10px] mr-1">{t('synergiesShort')}</span>
                                    {ptSynergies.map(syn => (
                                        <span key={syn} className="bg-slate-850 text-indigo-200 px-2 py-1 rounded-lg border border-slate-700/50 flex items-center gap-1.5 font-semibold shadow-sm">
                                            {renderRoleIcon(syn, syn)} {roleLabel(syn)}
                                        </span>
                                    ))}
                                    {ptSynergies.length === 0 && <span className="text-slate-500 italic">{roleLabel('Nenhuma')}</span>}
                                </div>
                            </div>
                        );
                    }
                });
            };

            const classOptions = [...new Set(characters.map(c => c.charClass))].sort();
            const filterFieldCls = "bg-slate-800 text-slate-200 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-700 hover:border-slate-500 focus:border-indigo-500 focus:outline-none transition-colors";

            return (
                <div className="min-h-screen p-6">
                    
                    <header className="max-w-[1700px] mx-auto pt-4 pb-8 px-4">
                        <div className="flex justify-end items-center gap-1.5 mb-2">
                            <div className="flex h-8 rounded-lg overflow-hidden border border-slate-700 bg-slate-800/80 mr-1" role="group" aria-label={t('langAria')}>
                                {[['pt', 'PT'], ['en', 'EN'], ['es', 'ES']].map(([code, label]) => (
                                    <button key={code} onClick={() => changeLang(code)} aria-pressed={lang === code} title={LANG_NAMES[code]} className={`w-8 text-[11px] font-black transition-all ${lang === code ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>{label}</button>
                                ))}
                            </div>
                            <button onClick={undo} disabled={historyCount === 0} aria-label={t('undo')} className="w-8 h-8 flex items-center justify-center rounded-lg text-sm bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 transition-all disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-slate-800/80" title={t('undoTip')}>↩️</button>
                            <button onClick={resetAllWeekly} aria-label={t('resetAria')} className="h-8 px-2.5 flex items-center gap-1.5 rounded-lg text-xs font-bold bg-green-900/30 text-green-400 hover:bg-green-900/60 hover:text-green-300 border border-green-800/40 transition-all whitespace-nowrap" title={t('resetTip')}>
                                <Icons.RefreshCw size={13} /> <span className="opacity-80">{formatCountdown(nextResetIn)}</span>
                            </button>
                            <div className="relative" ref={menuRef}>
                                <button onClick={() => setMenuOpen(o => !o)} aria-label={t('moreAria')} aria-expanded={menuOpen} className="w-8 h-8 flex items-center justify-center rounded-lg text-base font-black bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 transition-all" title={t('moreTip')}>⋯</button>
                                {menuOpen && (
                                    <div className="absolute right-0 top-full mt-1.5 w-52 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl py-1 z-50 text-sm">
                                        <button onClick={() => { setMenuOpen(false); shareLink(); }} className="w-full text-left px-4 py-2 text-slate-200 hover:bg-slate-700 font-semibold">{t('shareItem')}</button>
                                        <button onClick={() => { setMenuOpen(false); exportData(); }} className="w-full text-left px-4 py-2 text-slate-200 hover:bg-slate-700 font-semibold">{t('exportItem')}</button>
                                        <button onClick={() => { setMenuOpen(false); importInputRef.current && importInputRef.current.click(); }} className="w-full text-left px-4 py-2 text-slate-200 hover:bg-slate-700 font-semibold">{t('importItem')}</button>
                                    </div>
                                )}
                            </div>
                            <input ref={importInputRef} type="file" accept=".json,application/json" onChange={importData} className="hidden" />
                        </div>
                        <div className="flex items-center justify-center gap-3 sm:gap-6">
                            <img src={LOGO_SRC} alt="Logo Koij" className="h-14 w-14 sm:h-24 sm:w-24 md:h-28 md:w-28 object-contain select-none drop-shadow-[0_0_18px_rgba(129,140,248,0.35)] hover:scale-105 hover:rotate-3 transition-transform duration-300" draggable="false" />
                            <h1 className="text-white uppercase text-3xl sm:text-6xl md:text-7xl tracking-[0.15em] sm:tracking-[0.3em] pl-[0.15em] sm:pl-[0.3em]" style={{ fontFamily: "'Montserrat', ui-sans-serif, system-ui, sans-serif", fontWeight: 200 }}>
                                LOST ORGANIZER
                            </h1>
                        </div>
                    </header>

                    {resetPending && (
                        <div className="max-w-[1700px] mx-auto mb-4 px-4">
                            <div className="bg-amber-900/30 border border-amber-700/50 text-amber-200 rounded-xl p-3 flex flex-wrap items-center gap-3 justify-between">
                                <span className="font-bold text-sm">{t('resetBanner')}</span>
                                <div className="flex gap-2">
                                    <button onClick={applyWeeklyReset} className="px-4 py-1.5 rounded-lg font-bold bg-green-700 hover:bg-green-600 text-white text-sm transition-all">{t('resetNow')}</button>
                                    <button onClick={() => setResetAck(currentReset)} className="px-4 py-1.5 rounded-lg font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm border border-slate-700 transition-all">{t('dismiss')}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TABS DE RAIDS & RESET SEMANAL */}
                    <div className="max-w-[1700px] mx-auto mb-0 flex gap-2 overflow-x-auto pt-2 px-4 scrollbar-thin items-end">
                        {raids.map(raid => (
                            <button 
                                key={raid.id}
                                onClick={() => setActiveRaidId(raid.id)}
                                className={`px-5 py-3 rounded-t-xl font-bold flex items-center gap-2 whitespace-nowrap transition-all border-t-2 border-x-2 ${activeRaidId === raid.id ? 'bg-slate-800 text-white border-slate-700/50 shadow-md' : 'bg-slate-900 text-slate-400 border-transparent hover:bg-slate-800'}`}
                            >
                                <span>{raid.emoji}</span> {raid.title}
                            </button>
                        ))}
                        <button 
                            onClick={createNewRaid}
                            className="px-4 py-3 rounded-t-xl font-bold bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white flex items-center gap-1 transition-all"
                        >
                            <Icons.Plus size={16} /> {t('newRaid')}
                        </button>
                        

                    </div>

                    {/* Barra compacta da Raid Ativa */}
                    <div className="max-w-[1700px] mx-auto mb-5 bg-slate-800 p-3 rounded-b-xl rounded-tr-xl shadow-lg border border-slate-700 flex flex-wrap items-center gap-2 sm:gap-3">
                        <input type="text" value={activeRaid.emoji} onChange={(e) => updateActiveRaid(r => ({ ...r, emoji: e.target.value }))} className="w-11 h-10 bg-slate-900/60 text-xl text-center rounded-lg border border-transparent hover:border-slate-600 focus:border-indigo-500 focus:outline-none transition-colors" title={t('raidIconTip')} aria-label={t('raidIconAria')} />

                        <input type="text" value={activeRaid.title} onChange={(e) => updateActiveRaid(r => ({ ...r, title: e.target.value }))} className="flex-1 min-w-[170px] h-10 bg-slate-900/60 text-lg sm:text-xl font-extrabold text-white px-3 rounded-lg border border-transparent hover:border-slate-600 focus:border-indigo-500 focus:outline-none transition-colors" title={t('raidTitleLabel')} aria-label={t('raidTitleLabel')} />

                        <div className="flex items-center gap-1 h-10 bg-slate-900/60 rounded-lg px-2.5 border border-transparent hover:border-slate-600 transition-colors" title={t('ilvlRangeTip')}>
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mr-1">iLvl</span>
                            <input type="number" value={activeRaid.minIlevel} onChange={(e) => updateActiveRaid(r => ({ ...r, minIlevel: e.target.value }))} placeholder={t('minPh')} aria-label={t('ilvlMinAria')} className="w-14 bg-transparent text-sm font-bold text-white text-center focus:outline-none placeholder:text-slate-600 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none" />
                            <span className="text-slate-600">–</span>
                            <input type="number" value={activeRaid.maxIlevel} onChange={(e) => updateActiveRaid(r => ({ ...r, maxIlevel: e.target.value }))} placeholder={t('maxPh')} aria-label={t('ilvlMaxAria')} className="w-14 bg-transparent text-sm font-bold text-white text-center focus:outline-none placeholder:text-slate-600 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none" />
                        </div>

                        <div className="flex h-10 items-center rounded-lg bg-slate-900/60 p-1 border border-slate-700/60" role="group" aria-label={t('groupSizeAria')}>
                            <button onClick={() => setRaidLayout(4)} aria-pressed={activeRaid.mode === 4} className={`h-8 px-3 rounded-md text-sm font-bold flex items-center gap-1.5 transition-all ${activeRaid.mode === 4 ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`} title={t('mode4Tip')}>4 <Icons.Users size={14} /></button>
                            <button onClick={() => setRaidLayout(8)} aria-pressed={activeRaid.mode !== 4} className={`h-8 px-3 rounded-md text-sm font-bold flex items-center gap-1.5 transition-all ${activeRaid.mode !== 4 ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`} title={t('mode8Tip')}>8 <Icons.Users size={14} /></button>
                        </div>

                        <button onClick={addGroup} className="h-10 px-3.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-lg flex items-center gap-1.5 shadow transition-all" title={t('addGroupTip')}><Icons.Plus size={16} /> {t('addGroup')}</button>

                        <button onClick={deleteCurrentRaid} className="h-10 w-10 bg-red-900/30 text-red-400 hover:bg-red-900/60 hover:text-red-300 rounded-lg transition-all flex items-center justify-center border border-red-800/40" title={t('deleteRaidTip')} aria-label={t('deleteRaidAria')}><Icons.Trash2 size={16} /></button>
                    </div>

                    {/* Main Board: painel lateral de personagens + área das PTs */}
                    <div className="max-w-[1700px] mx-auto pb-12 flex flex-col lg:flex-row gap-6 items-start">

                        {/* Painel lateral: Personagens Disponíveis (fixo ao rolar no desktop; recolhível no celular) */}
                        <aside className="w-full lg:w-[290px] lg:flex-shrink-0 lg:sticky lg:top-4 z-10">
                            <button onClick={() => setPanelOpen(o => !o)} className="lg:hidden w-full mb-2 px-4 py-2.5 rounded-lg font-bold bg-slate-800 text-slate-200 border border-slate-700 flex items-center justify-between">
                                <span>{t('panelToggle')}</span>
                                <span>{panelOpen ? '▲' : '▼'}</span>
                            </button>
                            <div className={`${panelOpen ? 'block' : 'hidden'} lg:block max-h-[60vh] lg:max-h-[calc(100vh-2rem)] overflow-y-auto pr-1 scrollbar-thin`}>
                                <div className="flex flex-wrap gap-2 items-center mb-3">
                                    <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder={t('searchPh')} className={`${filterFieldCls} w-full`} />
                                    <select value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)} className={`${filterFieldCls} flex-1 min-w-0`} title={t('roleFilterTip')}>
                                        <option value="Todos">{t('roleAll')}</option>
                                        <option value="DPS">{roleLabel('DPS')}</option>
                                        <option value="Suporte">{roleLabel('Suporte')}</option>
                                    </select>
                                    <select value={classFilter} onChange={(e) => setClassFilter(e.target.value)} className={`${filterFieldCls} flex-1 min-w-0`} title={t('classFilterTip')}>
                                        <option value="Todas">{t('classAll')}</option>
                                        {classOptions.map(cl => <option key={cl} value={cl}>{cl}</option>)}
                                    </select>
                                    {hasGarageFilter && (
                                        <button onClick={() => { setSearch(''); setRoleFilter('Todos'); setClassFilter('Todas'); }} className="w-full px-3 py-2 rounded-lg text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 transition-all whitespace-nowrap">{t('clearFilters')}</button>
                                    )}
                                </div>
                                <DropZone locationId="garage" title={t('availableTitle')} isParty={false} sidebar={true} onAddClick={() => openEditModal()} />
                            </div>
                        </aside>

                        {/* Área das PTs */}
                        <div className="flex-1 min-w-0 w-full flex flex-col gap-6">

                        {/* Divisor Visual de Alta Definição */}
                        <div className="relative">
                            <div className="absolute inset-0 flex items-center" aria-hidden="true">
                                <div className="w-full border-t-2 border-slate-800/80"></div>
                            </div>
                            <div className="relative flex justify-center">
                                <span className="bg-slate-900 px-6 py-2 text-xs font-black tracking-widest text-indigo-400 uppercase flex items-center gap-2.5 border border-slate-700/60 rounded-full shadow-lg backdrop-blur-sm">
                                    <Icons.Sword size={13} strokeWidth="2.5" className="text-indigo-400 animate-pulse" /> 
                                    {t('builderTitle')}
                                    <Icons.Sword size={13} strokeWidth="2.5" className="text-indigo-400 animate-pulse" />
                                </span>
                            </div>
                        </div>
                        
                        {/* Tabuleiro Principal de Raids (Grid Flexível para as PTs e Lobbies de 8) */}
                        <div className={activeRaid.mode === 4 ? "grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 min-[1760px]:grid-cols-4 gap-6 justify-items-center w-full" : "grid grid-cols-1 min-[1760px]:grid-cols-2 gap-6 justify-items-center min-[1760px]:justify-items-start w-full"}>
                            {renderRaidLayout()}
                        </div>
                        </div>
                    </div>

                    <footer className="max-w-[1700px] mx-auto text-center text-[11px] text-slate-500 pb-6 px-4">
                        {t('footer1')}
                        <br />{t('footer2')}
                    </footer>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-600 shadow-2xl w-full max-w-lg">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-white">{characters.find(c => c.id === editingChar.id) ? t('editChar') : t('newChar')}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.X size={24} /></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="block text-sm font-bold text-slate-400 mb-1">Roster</label>
                                            <input type="text" value={editingChar.roster} onChange={e => { const r = e.target.value; setEditingChar({ ...editingChar, roster: r, tempColor: rosterColors[r] || editingChar.tempColor }); }} placeholder={t('rosterPh')} className="w-full bg-slate-900 p-3 rounded-lg border border-slate-600 text-white focus:border-indigo-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-1">{t('lblColor')}</label>
                                            <div className="w-12 h-12 rounded-lg overflow-hidden border-2 border-slate-600 cursor-pointer">
                                                <input type="color" value={editingChar.tempColor} onChange={e => setEditingChar({ ...editingChar, tempColor: e.target.value })} className="w-16 h-16 -mt-2 -ml-2 cursor-pointer" />
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 mb-1">{t('lblClass')}</label>
                                        <select value={editingChar.charClass} onChange={e => setEditingChar({ ...editingChar, charClass: e.target.value })} className="w-full bg-slate-900 p-3 rounded-lg border border-slate-600 text-white focus:border-indigo-500 outline-none">
                                            {LA_CLASSES.map(cls => <option key={cls} value={cls}>{CLASS_ICONS[cls]} {cls}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="w-1/4">
                                            <label className="block text-sm font-bold text-slate-400 mb-1">{t('lblItemLevel')}</label>
                                            <input type="number" value={editingChar.ilvl} onChange={e => setEditingChar({ ...editingChar, ilvl: e.target.value })} className="w-full bg-slate-900 p-3 rounded-lg border border-slate-600 text-white focus:border-indigo-500 outline-none" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm font-bold text-slate-400 mb-1">{t('lblPrimaryRole')}</label>
                                            <select value={editingChar.primaryRole} onChange={e => setEditingChar({ ...editingChar, primaryRole: e.target.value })} className="w-full bg-slate-900 p-3 rounded-lg border border-slate-600 text-white focus:border-indigo-500 outline-none">
                                                {PRIMARY_ROLES.map(role => <option key={role} value={role}>{roleLabel(role)}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-sm font-bold text-slate-400 mb-1">{t('lblSynergy')}</label>
                                            <select value={editingChar.secondaryRole} onChange={e => setEditingChar({ ...editingChar, secondaryRole: e.target.value })} className="w-full bg-slate-900 p-3 rounded-lg border border-slate-600 text-white focus:border-indigo-500 outline-none">
                                                {SYNERGIES.map(role => <option key={role} value={role}>{roleLabel(role)}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center mt-8 pt-4 border-t border-slate-700">
                                    <button onClick={() => deleteCharacter(editingChar.id)} className="text-red-400 hover:text-red-300 flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-red-400/10 transition-colors" title={t('deleteFromRosterTip')}><Icons.Trash2 size={18} /> {t('deleteFromRoster')}</button>
                                    <div className="flex gap-3">
                                        <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-slate-300 hover:text-white transition-colors">{t('cancel')}</button>
                                        <button onClick={saveCharacter} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg transition-colors">{t('save')}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Alert Modal Customizado */}
                    {alertDialog.isOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-600 shadow-2xl w-full max-w-sm text-center">
                                <div className="text-yellow-400 mb-4 flex justify-center">
                                    <Icons.ShieldAlert size={48} />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-4">{alertDialog.message}</h3>
                                <button onClick={() => setAlertDialog({ isOpen: false, message: '' })} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition-colors w-full">{t('ok')}</button>
                            </div>
                        </div>
                    )}

                    {/* Confirm Modal Customizado */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-600 shadow-2xl w-full max-w-md text-center">
                                <h3 className="text-xl font-bold text-white mb-6">{confirmDialog.message}</h3>
                                <div className="flex gap-4 justify-center">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg transition-colors flex-1">{t('cancel')}</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({ isOpen: false, message: '', onConfirm: null }); }} className="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition-colors flex-1">{t('confirm')}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
